<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>VNJet - Quản lý lịch bay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        select:required:invalid {
            color: grey;
        }

        option {
            color: black;
        }

        body {
            background-image: url("{{ url_for('static', filename='images/sky.jfif') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Khung bảng danh sách chuyến bay có thanh cuộn */
        .khung-bang-lich-bay {
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

    <!-- THANH MENU TRÊN CÙNG -->
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="/">
                <img alt="Logo" height="80" src="{{ url_for('static', filename='images/logo.png') }}">
            </a>

            <button class="navbar-toggler"
                    data-bs-target="#mynavbar"
                    data-bs-toggle="collapse"
                    type="button">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Tra cứu chuyến bay</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ban-ve">Bán & Xuất vé</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/quan-ly-lich-bay">Quản lý lịch bay</a>
                    </li>
                </ul>

                <!-- Thông tin nhân viên góc phải -->
                <div class="dropdown">
                    <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <strong>Minh Tú</strong> (Nhân viên)
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item text-danger" href="/">Đăng xuất</a></li>
                    </ul>
                </div>
            </div>

        </div>
    </nav>


    <!-- KHUNG NỘI DUNG CHÍNH -->
    <div class="d-flex justify-content-center align-items-center py-4" style="min-height: calc(100vh - 56px);">
        <div class="border rounded p-4 shadow bg-white" style="width: 80%;">

            <!-- PHẦN 1: BẢNG DANH SÁCH LỊCH BAY (CHỜ DỮ LIỆU TỪ MYSQL) -->
            <h4 class="text-center mb-3">
                <b>Danh sách lịch bay hiện tại</b>
            </h4>

            <div class="khung-bang-lich-bay border rounded mb-4">
                <table class="table table-bordered table-hover text-center mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Mã chuyến bay</th>
                            <th>Điểm đi</th>
                            <th>Điểm đến</th>
                            <th>Ngày bay</th>
                            <th>Giờ khởi hành</th>
                            <th>Giờ hạ cánh</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Sau này dùng vòng lặp Jinja2 đổ dữ liệu từ MySQL vào đây -->
                    </tbody>
                </table>
            </div>


            <hr class="my-4">


            <!-- PHẦN 2: FORM THAY ĐỔI / CẬP NHẬT LỊCH BAY -->
            <h4 class="text-center mb-3">
                <b>Cập nhật thông tin chuyến bay</b>
            </h4>

            <form action="/quan-ly-lich-bay" method="POST">

                <!-- Hàng 1: Mã chuyến bay, Điểm đi, Điểm đến -->
                <div class="row mb-3">

                    <div class="col-md-4">
                        <label class="form-label">Mã chuyến bay (*)</label>
                        <input type="text"
                               class="form-control"
                               id="ma_chuyen_bay"
                               name="ma_chuyen_bay"
                               placeholder="Ví dụ: VNJET2378"
                               required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Điểm đi (*)</label>
                        <select class="form-select" id="diem_di" name="diem_di" required>
                            <option disabled hidden selected value="">Chọn điểm đi</option>
                            <option value="TP.HCM">TP.HCM</option>
                            <option value="Hà Nội">Hà Nội</option>
                            <option value="Đà Nẵng">Đà Nẵng</option>
                            <option value="Huế">Huế</option>
                            <option value="Hải Phòng">Hải Phòng</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Điểm đến (*)</label>
                        <select class="form-select" id="diem_den" name="diem_den" required>
                            <option disabled hidden selected value="">Chọn điểm đến</option>
                            <option value="TP.HCM">TP.HCM</option>
                            <option value="Hà Nội">Hà Nội</option>
                            <option value="Đà Nẵng">Đà Nẵng</option>
                            <option value="Huế">Huế</option>
                            <option value="Hải Phòng">Hải Phòng</option>
                        </select>
                    </div>

                </div>


                <!-- Hàng 2: Ngày bay, Giờ khởi hành, Giờ hạ cánh -->
                <div class="row mb-3">

                    <div class="col-md-4">
                        <label class="form-label">Ngày bay (*)</label>
                        <input type="text"
                               class="form-control"
                               id="ngay_bay"
                               name="ngay_bay"
                               placeholder="Chọn ngày bay"
                               onfocus="this.type='date'; this.min=new Date().toLocaleDateString('en-CA');"
                               onblur="if(!this.value) this.type='text'"
                               required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Giờ khởi hành (*)</label>
                        <input type="time"
                               class="form-control"
                               id="gio_khoi_hanh"
                               name="gio_khoi_hanh"
                               required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Giờ hạ cánh (*)</label>
                        <input type="time"
                               class="form-control"
                               id="gio_ha_canh"
                               name="gio_ha_canh"
                               required>
                    </div>

                </div>


                <!-- Hàng 3: Trạng thái chuyến bay & Nút lưu -->
                <div class="row align-items-end">

                    <div class="col-md-6">
                        <label class="form-label">Trạng thái chuyến bay</label>
                        <select class="form-select" id="trang_thai" name="trang_thai">
                            <option value="Đúng giờ" selected>Đúng giờ</option>
                            <option value="Hoãn chuyến">Hoãn chuyến (Delay)</option>
                            <option value="Hủy chuyến">Hủy chuyến</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <button type="reset" class="btn btn-secondary w-100">
                            Làm mới
                        </button>
                    </div>

                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100">
                            Cập nhật lịch bay
                        </button>
                    </div>

                </div>

            </form>

        </div>
    </div>

</body>
</html>
