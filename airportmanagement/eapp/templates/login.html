<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        select:required:invalid {
            color: grey;
        }

        option {
            color: black;
        }

        body {
            background-image: url("{{ url_for('static', filename='images/sky.jfif') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">
            <img alt="Logo" height="80" src="{{ url_for('static', filename='images/logo.png') }}">
        </a>
        <button class="navbar-toggler" data-bs-target="#mynavbar" data-bs-toggle="collapse" type="button">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)"
                       onclick="alert('Bạn cần đăng nhập để sử dụng chức năng này')">Ưu đãi khách hàng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)"
                       onclick="alert('Bạn cần đăng nhập để sử dụng chức năng này')">Giỏ vé</a>
                </li>
            </ul>
            <button class="btn btn-primary" type="button">Đăng nhập</button>
        </div>
    </div>
</nav>

<div class="container pt-3">
    <div class="bg-white rounded shadow p-4 d-flex flex-column" style="height: 600px;">
        <div class="row h-100">
            <div class="col d-flex flex-column  ">
                <div class="row my-auto">
                    <div class="col-3" align="right">
                        <select class="form-select mb-3" style="width: 120px;" required>
                            <option disabled hidden selected value="">Mã vùng</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <input type="text" class="form-control" id="username" placeholder="Số điện thoại" name="phone"
                               required/>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-success" type="submit">Xác nhận</button>
                    </div>
                    <hr class="my-3">

                    <div class="d-flex gap-2">
                        <button class="btn btn-dark w-100">Google</button>
                        <button class="btn btn-dark w-100">Apple</button>
                    </div>
                </div>
            </div>
            <div class="col-md-6 d-none d-md-block">
                <img src="{{ url_for('static', filename='images/download.jfif') }}" class="w-100 h-100" style="object-fit: cover;" alt="Banner">
            </div>
        </div>
    </div>
</div>
</body>
</html>
